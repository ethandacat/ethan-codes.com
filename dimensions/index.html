<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dimension Visualizer — ethan-codes.com</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;color:#e0e0e8;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100dvh;display:flex;flex-direction:column}

  #header{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e1e2e;flex-shrink:0}
  #header h1{font-size:1.1rem;font-weight:600;letter-spacing:.05em;color:#c8b8f0}
  #header a{color:#7070a0;text-decoration:none;font-size:.85rem}#header a:hover{color:#c8b8f0}

  #dim-selector{display:flex;gap:6px;padding:14px 24px;flex-shrink:0}
  .dim-btn{
    padding:6px 14px;border-radius:20px;border:1px solid #2e2e4e;
    background:#131320;color:#9090b8;font-size:.82rem;cursor:pointer;
    transition:all .2s;user-select:none
  }
  .dim-btn:hover{border-color:#5050a0;color:#c8b8f0}
  .dim-btn.active{background:#2a1a5e;border-color:#8060d0;color:#e0d0ff;box-shadow:0 0 12px #6040b040}

  #desc{padding:0 24px 12px;font-size:.82rem;color:#6060a0;min-height:1.5em}

  #canvas-wrap{flex:1;position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%}

  #hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
    font-size:.75rem;color:#40406080;pointer-events:none;white-space:nowrap}

  #controls{position:absolute;top:12px;right:16px;display:flex;flex-direction:column;gap:8px}
  .ctrl-btn{
    width:36px;height:36px;border-radius:8px;border:1px solid #2e2e4e;
    background:#131320cc;backdrop-filter:blur(4px);color:#7070a0;font-size:.9rem;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .15s
  }
  .ctrl-btn:hover{border-color:#6060a0;color:#c8b8f0}
  .ctrl-btn.active{background:#2a1a5e;border-color:#8060d0;color:#e0d0ff}
</style>
</head>
<body>

<div id="header">
  <h1>✦ Dimension Visualizer</h1>
  <a href="/">← back</a>
</div>

<div id="dim-selector">
  <button class="dim-btn" data-d="0">0D</button>
  <button class="dim-btn" data-d="1">1D</button>
  <button class="dim-btn" data-d="2">2D</button>
  <button class="dim-btn active" data-d="3">3D</button>
  <button class="dim-btn" data-d="4">4D</button>
  <button class="dim-btn" data-d="5">5D</button>
</div>

<div id="desc"></div>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="controls">
    <button class="ctrl-btn" id="btn-auto" title="Auto-rotate">⟳</button>
    <button class="ctrl-btn" id="btn-reset" title="Reset view">⌂</button>
  </div>
  <div id="hint">drag to rotate</div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  DIMENSION VISUALIZER — rendered/shaded hypercube engine
// ═══════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');

// ── Descriptions ─────────────────────────────────────
const DESCS = [
  "A single point — no length, width, or depth. It simply exists.",
  "A line segment — one direction. Start and end. That's all a 1D world has.",
  "A square — a flat surface. Two directions, infinite area, zero thickness.",
  "A cube — the shape you know. Three directions, volume, light, shadow.",
  "A tesseract — a cube extended into a 4th direction you can't fully picture. We show its 3D shadow.",
  "A penteract — one more step beyond. 32 corners, 80 edges, rendered as its shadow in our space.",
];

// ── Geometry: n-cube vertices & edges ────────────────
function nCubeVertices(n) {
  const verts = [];
  for (let i = 0; i < (1 << n); i++) {
    const v = [];
    for (let b = 0; b < n; b++) v.push((i >> b & 1) * 2 - 1); // -1 or +1
    verts.push(v);
  }
  return verts;
}
function nCubeEdges(n) {
  const V = 1 << n, edges = [];
  for (let i = 0; i < V; i++)
    for (let b = 0; b < n; b++)
      if (!(i >> b & 1)) edges.push([i, i | (1 << b)]);
  return edges;
}
function nCubeFaces(n) {
  // Returns quads (4-vertex faces); an n-cube has n*(n-1)/2 * 2^(n-2) faces
  // We enumerate all 2D faces: pick 2 axes a,b; fix remaining at -1/+1
  const faces = [];
  for (let a = 0; a < n; a++) {
    for (let b = a+1; b < n; b++) {
      // 2^(n-2) combinations for remaining axes
      const rest = [];
      for (let k = 0; k < n; k++) if (k!==a && k!==b) rest.push(k);
      const combos = 1 << rest.length;
      for (let c = 0; c < combos; c++) {
        const base = new Array(n).fill(0);
        for (let ri = 0; ri < rest.length; ri++)
          base[rest[ri]] = (c >> ri & 1) ? 1 : -1;
        // 4 corners of this face: (a,b) = (-1,-1),(-1,+1),(+1,+1),(+1,-1)
        const corners = [[- 1,-1],[- 1,1],[1,1],[1,-1]];
        const quad = corners.map(([av,bv]) => {
          const v = [...base];
          v[a] = av; v[b] = bv;
          return v;
        });
        faces.push({ quad, a, b, base });
      }
    }
  }
  return faces;
}

// ── Rotation matrix in plane (i,j) ───────────────────
function makeRot(n, i, j, angle) {
  const M = Array.from({length:n}, (_,r) => Array.from({length:n}, (_,c) => r===c?1:0));
  M[i][i] =  Math.cos(angle); M[i][j] = -Math.sin(angle);
  M[j][i] =  Math.sin(angle); M[j][j] =  Math.cos(angle);
  return M;
}
function mulMat(A, B) {
  const n=A.length, M=Array.from({length:n},()=>new Array(n).fill(0));
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)for(let k=0;k<n;k++) M[r][c]+=A[r][k]*B[k][c];
  return M;
}
function applyMat(M, v) {
  return M.map(row => row.reduce((s,m,i)=>s+m*v[i],0));
}

// ── Perspective project nD → 3D ──────────────────────
function projectToN(v, targetN, camDist) {
  // iteratively project from dim(v) down to targetN using perspective
  let u = [...v];
  while (u.length > targetN) {
    const d = u.length;
    const w = camDist / (camDist - u[d-1]);
    u = u.slice(0, d-1).map(x => x * w);
  }
  return u;
}

// ── 3D → 2D orthographic (after perspective to 3D) ───
function project3to2(p3, scale, cx, cy) {
  return [cx + p3[0]*scale, cy - p3[1]*scale];
}

// ── State ─────────────────────────────────────────────
let DIM = 3;
let angles = {}; // "i_j" -> angle
let autoRotate = false;
let lastT = 0;

// drag state
let drag = false;
let dragLast = [0,0];

// ── Rotation angles per dimension ────────────────────
function defaultAngles(n) {
  const a = {};
  if (n >= 2) { a['0_1'] = 0.3; }
  if (n >= 3) { a['0_2'] = -0.5; a['1_2'] = 0.2; }
  if (n >= 4) { a['0_3'] = 0.4; a['1_3'] = 0.3; }
  if (n >= 5) { a['0_4'] = 0.2; a['2_4'] = 0.3; }
  return a;
}

function resetView() {
  angles = defaultAngles(DIM);
}

// ── Build combined rotation matrix ───────────────────
function buildRotMatrix(n) {
  let M = Array.from({length:n}, (_,r) => Array.from({length:n}, (_,c) => r===c?1:0));
  for (const key in angles) {
    const [i,j] = key.split('_').map(Number);
    if (i < n && j < n) M = mulMat(M, makeRot(n, i, j, angles[key]));
  }
  return M;
}

// ── Lighting ──────────────────────────────────────────
// Light direction (in projected 3-space)
const LIGHT = normalize3([1.4, 2.0, 2.5]);
function normalize3(v){const l=Math.sqrt(v[0]**2+v[1]**2+v[2]**2);return v.map(x=>x/l)}
function dot3(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}

function faceNormal3(p3s) {
  // p3s: array of 3D points for this face
  const [A,B,C] = p3s;
  const u=[B[0]-A[0],B[1]-A[1],B[2]-A[2]];
  const v=[C[0]-A[0],C[1]-A[1],C[2]-A[2]];
  return normalize3([u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]]);
}

// ── Color palette per axis pair ───────────────────────
const FACE_COLORS = [
  [180,130,255], // XY  - purple
  [100,180,255], // XZ  - blue
  [255,140,100], // YZ  - orange
  [80, 200,160], // XW  - teal
  [255,200, 80], // YW  - gold
  [200, 80,160], // ZW  - pink
  [120,220,100], // XV  - green
  [255,120,180], // YV  - rose
  [160,140,255], // ZV  - lavender
  [255,180, 60], // WV  - amber
];

function faceColorBase(faceIdx) {
  return FACE_COLORS[faceIdx % FACE_COLORS.length];
}

// ── Render ────────────────────────────────────────────
function resize() {
  const r = wrap.getBoundingClientRect();
  canvas.width = r.width * devicePixelRatio;
  canvas.height = r.height * devicePixelRatio;
}

function render(t=0) {
  const W = canvas.width, H = canvas.height;
  const dt = Math.min((t - lastT)/1000, 0.05);
  lastT = t;

  if (autoRotate) {
    angles['0_1'] = (angles['0_1']||0) + dt*0.5;
    if (DIM>=3) angles['1_2'] = (angles['1_2']||0) + dt*0.3;
    if (DIM>=4) angles['0_3'] = (angles['0_3']||0) + dt*0.2;
    if (DIM>=5) angles['2_4'] = (angles['2_4']||0) + dt*0.15;
  }

  ctx.clearRect(0,0,W,H);

  // background gradient
  const bg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  bg.addColorStop(0,'#13102a');
  bg.addColorStop(1,'#06060f');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  const n = DIM;
  const scale = Math.min(W,H) * (n<=1?0.35 : n<=2?0.28 : n<=3?0.28 : 0.22);
  const cx=W/2, cy=H/2;
  const camDist = 3.5;

  if (n === 0) {
    renderPoint(cx,cy,scale);
    requestAnimationFrame(render);
    return;
  }
  if (n === 1) {
    renderLine(cx,cy,scale);
    requestAnimationFrame(render);
    return;
  }

  const verts = nCubeVertices(n);
  const faces = nCubeFaces(n);
  const M = buildRotMatrix(n);

  // transform all verts
  const rotVerts = verts.map(v => applyMat(M, v));

  // project each vert down to 3D (for lighting), then to 2D
  const proj3 = rotVerts.map(v => {
    if (v.length <= 3) return [...v, ...Array(3-v.length).fill(0)];
    return projectToN(v, 3, camDist);
  });
  const proj2 = proj3.map(p => project3to2(p, scale, cx, cy));

  if (n === 2) {
    renderFlat2D(proj2, scale, cx, cy);
    requestAnimationFrame(render);
    return;
  }

  // Build face render list with depth + lighting
  const faceList = faces.map((f, fi) => {
    const p3s = f.quad.map(v => {
      const rv = applyMat(M, v);
      return projectToN(rv, 3, camDist);
    });
    const p2s = p3s.map(p => project3to2(p, scale, cx, cy));

    // depth = average Z of projected-3D points
    const depth = p3s.reduce((s,p)=>s+p[2],0)/4;

    // normal
    const norm = faceNormal3(p3s);

    // diffuse lighting
    const diff = Math.max(0, dot3(norm, LIGHT));
    // ambient + diffuse
    const light = 0.18 + 0.82 * diff;

    // specular
    const spec = Math.pow(Math.max(0, dot3(norm, normalize3([LIGHT[0],LIGHT[1],LIGHT[2]+0.5]))), 12) * 0.3;

    // face color
    const [r,g,b] = faceColorBase(fi);

    return { p2s, depth, light, spec, r, g, b, norm, fi };
  });

  // Sort back-to-front
  faceList.sort((a,b) => a.depth - b.depth);

  // Draw faces
  for (const f of faceList) {
    const {p2s, light, spec, r, g, b} = f;

    // skip back faces (basic culling — skip when normal points away from camera)
    // For high-D we skip culling to show all faces
    if (n === 3 && f.norm[2] < -0.05) continue;

    const fr = Math.round(Math.min(255, r*light + spec*255));
    const fg = Math.round(Math.min(255, g*light + spec*255));
    const fb = Math.round(Math.min(255, b*light + spec*255));

    ctx.beginPath();
    ctx.moveTo(p2s[0][0], p2s[0][1]);
    for (let i=1;i<p2s.length;i++) ctx.lineTo(p2s[i][0],p2s[i][1]);
    ctx.closePath();

    ctx.fillStyle = `rgba(${fr},${fg},${fb},0.88)`;
    ctx.fill();

    // subtle edge
    ctx.strokeStyle = `rgba(255,255,255,0.08)`;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  // Ambient occlusion-style vignette
  const vig = ctx.createRadialGradient(cx,cy,scale*0.5,cx,cy,scale*1.8);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,0.25)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);

  requestAnimationFrame(render);
}

function renderPoint(cx,cy,scale) {
  // glowing sphere dot
  const r = scale*0.08;
  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r*3);
  g.addColorStop(0,'rgba(220,200,255,1)');
  g.addColorStop(0.3,'rgba(160,120,255,0.8)');
  g.addColorStop(1,'rgba(100,80,200,0)');
  ctx.beginPath(); ctx.arc(cx,cy,r*3,0,Math.PI*2);
  ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
}

function renderLine(cx,cy,scale) {
  const x0=cx-scale, x1=cx+scale;
  // line glow
  ctx.shadowColor='rgba(180,140,255,0.6)'; ctx.shadowBlur=20;
  const grad=ctx.createLinearGradient(x0,cy,x1,cy);
  grad.addColorStop(0,'rgba(120,80,200,0.2)');
  grad.addColorStop(0.5,'rgba(200,170,255,1)');
  grad.addColorStop(1,'rgba(120,80,200,0.2)');
  ctx.strokeStyle=grad; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x0,cy); ctx.lineTo(x1,cy); ctx.stroke();
  ctx.shadowBlur=0;
  // endpoints
  for (const x of [x0,x1]) {
    const g=ctx.createRadialGradient(x,cy,0,x,cy,8);
    g.addColorStop(0,'#fff'); g.addColorStop(1,'rgba(160,120,255,0)');
    ctx.beginPath(); ctx.arc(x,cy,8,0,Math.PI*2);
    ctx.fillStyle=g; ctx.fill();
  }
}

function renderFlat2D(proj2, scale, cx, cy) {
  // 2D square rendered with subtle gradient shading
  const verts2D = nCubeVertices(2);
  const M2 = buildRotMatrix(2);
  const rv = verts2D.map(v => applyMat(M2,v));
  const p2 = rv.map(v => project3to2([v[0],v[1],0], scale, cx, cy));

  // fill
  const grad=ctx.createLinearGradient(p2[0][0],p2[0][1],p2[3][0],p2[3][1]);
  grad.addColorStop(0,'rgba(160,120,255,0.9)');
  grad.addColorStop(1,'rgba(80,60,180,0.9)');
  ctx.beginPath();
  ctx.moveTo(p2[0][0],p2[0][1]);
  ctx.lineTo(p2[1][0],p2[1][1]);
  ctx.lineTo(p2[3][0],p2[3][1]);
  ctx.lineTo(p2[2][0],p2[2][1]);
  ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  ctx.strokeStyle='rgba(220,200,255,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
}

// ── Input: drag to rotate ──────────────────────────────
canvas.addEventListener('mousedown', e => { drag=true; dragLast=[e.clientX,e.clientY]; });
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = e.clientX - dragLast[0];
  const dy = e.clientY - dragLast[1];
  dragLast = [e.clientX,e.clientY];

  const speed = 0.008;
  if (DIM >= 2) angles['0_1'] = (angles['0_1']||0) + dx*speed;
  if (DIM >= 3) angles['1_2'] = (angles['1_2']||0) + dy*speed;
  if (DIM >= 4) angles['0_3'] = (angles['0_3']||0) + (dx+dy)*speed*0.5;
  if (DIM >= 5) angles['2_4'] = (angles['2_4']||0) + dy*speed*0.4;
});
window.addEventListener('mouseup', () => drag=false);

// touch
canvas.addEventListener('touchstart', e=>{e.preventDefault();drag=true;dragLast=[e.touches[0].clientX,e.touches[0].clientY]},{passive:false});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(!drag)return;
  const dx=e.touches[0].clientX-dragLast[0], dy=e.touches[0].clientY-dragLast[1];
  dragLast=[e.touches[0].clientX,e.touches[0].clientY];
  const speed=0.01;
  if(DIM>=2) angles['0_1']=(angles['0_1']||0)+dx*speed;
  if(DIM>=3) angles['1_2']=(angles['1_2']||0)+dy*speed;
  if(DIM>=4) angles['0_3']=(angles['0_3']||0)+(dx+dy)*speed*0.5;
  if(DIM>=5) angles['2_4']=(angles['2_4']||0)+dy*speed*0.4;
},{passive:false});
canvas.addEventListener('touchend',()=>drag=false);

// ── UI ────────────────────────────────────────────────
document.querySelectorAll('.dim-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.dim-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    DIM = +btn.dataset.d;
    resetView();
    document.getElementById('desc').textContent = DESCS[DIM];
  });
});

document.getElementById('btn-auto').addEventListener('click', function(){
  autoRotate=!autoRotate;
  this.classList.toggle('active',autoRotate);
});
document.getElementById('btn-reset').addEventListener('click',resetView);

// ── Boot ──────────────────────────────────────────────
new ResizeObserver(()=>{ resize(); }).observe(wrap);
resetView();
document.getElementById('desc').textContent = DESCS[DIM];

function boot() {
  resize();
  requestAnimationFrame(render);
}
// defer so flex layout is resolved
if (document.readyState === 'complete') {
  setTimeout(boot, 0);
} else {
  window.addEventListener('load', boot);
}
</script>
</body>
</html>
