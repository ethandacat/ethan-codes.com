<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ubuntu 22.04 — graphical (SDL) spike</title>
  <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" />
  <style>
    html, body { margin: 0; background: #111; color: #ccc; font: 13px/1.5 monospace; }
    #stage { display: flex; gap: 10px; padding: 10px; align-items: flex-start; }
    #canvas { background: #000; border: 1px solid #444; image-rendering: pixelated; }
    #terminal { flex: 1; height: 420px; }
    #status { padding: 4px 10px; color: #9c9; }
  </style>
</head>
<body>
  <div id="status">SDL display spike — loading qemu-system-x86_64.wasm…</div>
  <div id="stage">
    <canvas id="canvas" width="720" height="400" tabindex="0"></canvas>
    <div id="terminal"></div>
  </div>

  <script src="./load.js"></script>
  <script type="module">
    import 'https://unpkg.com/xterm@5.3.0/lib/xterm.js';
    import 'https://unpkg.com/xterm-pty/index.js';
    import './arg-module.js';
    import initEmscriptenModule from './out.js';

    const setStatus = (m) => { document.getElementById('status').textContent = m; };

    const xterm = new Terminal({ fontSize: 12, convertEol: true });
    xterm.open(document.getElementById('terminal'));
    const { master, slave } = openpty();
    xterm.loadAddon(master);
    Module.pty = slave;

    // Hand SDL a canvas to render the VGA framebuffer into. With
    // -sOFFSCREEN_FRAMEBUFFER the canvas stays on the main thread and the
    // render pthread's GL commands are proxied to it.
    Module.canvas = document.getElementById('canvas');
    Module['mainScriptUrlOrBlob'] = new URL('./out.js', import.meta.url).href;

    Module.printErr = (t) => { console.warn('[qemu]', t); };
    window.addEventListener('error', (e) => setStatus('error: ' + e.message));

    const info = 't:' + Math.round(Date.now() / 1000) + '\n';
    start(info);

    function start(info) {
      Module['preRun'].push((mod) => {
        try { mod.FS.mkdir('/pack'); } catch (e) {}
        mod.FS.writeFile('/pack/info', info);
      });
      let readableCallbacks = [];
      Module.pty.onReadable(() => { readableCallbacks.forEach((cb) => cb()); readableCallbacks = []; });
      Module['preRun'].push((mod) => {
        mod['TTY'].stream_ops.poll = (stream, timeout, notifyCallback) => {
          if (Module.pty.readable) return 1;
          if (notifyCallback != null) {
            notifyCallback.registerCleanupFunc(() => {
              const i = readableCallbacks.indexOf(notifyCallback);
              if (i != -1) readableCallbacks.splice(i, 1);
            });
            readableCallbacks.push(notifyCallback);
          }
          return 0;
        };
      });
      setStatus('booting Ubuntu 22.04 (amd64) with SDL display — watch the canvas…');
      (async () => { await initEmscriptenModule(Module); })();
    }
  </script>
</body>
</html>
