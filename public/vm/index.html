<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ubuntu 22.04 — in the browser</title>
  <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center;
            color: #9aa; font: 14px/1.6 monospace; text-align: center; z-index: 5; }
    #terminal { height: 100vh; padding: 6px; }
    .term-loaded #boot { display: none; }
  </style>
</head>
<body>
  <div id="boot">booting Ubuntu 22.04 (amd64) — loading ~190&nbsp;MB of QEMU + rootfs…<br>first load is slow; it is cached afterwards.</div>
  <div id="terminal"></div>

  <!-- Emscripten file-package loader for qemu-system-x86_64.data -->
  <script src="./load.js"></script>

  <script type="module">
    import 'https://unpkg.com/xterm@5.3.0/lib/xterm.js';
    import 'https://unpkg.com/xterm-pty/index.js';
    import './arg-module.js';
    import initEmscriptenModule from './out.js';

    const xterm = new Terminal({ fontFamily: 'monospace', fontSize: 14, convertEol: true });
    xterm.open(document.getElementById('terminal'));
    xterm.write('\x1b[90m[ connecting terminal to the VM… ]\x1b[0m\r\n');

    const { master, slave } = openpty();
    xterm.loadAddon(master);
    Module.pty = slave;

    // pthread workers (MTTCG) must know where to fetch the main script from.
    Module['mainScriptUrlOrBlob'] = new URL('./out.js', import.meta.url).href;

    // Serial console boot, no networking for this first run.
    const info = 't:' + Math.round(Date.now() / 1000) + '\n';
    start(info);

    function start(info) {
      Module['preRun'].push((mod) => {
        try { mod.FS.mkdir('/pack'); } catch (e) {}
        mod.FS.writeFile('/pack/info', info);
      });

      // Wire the pty's readability into Emscripten's TTY poll so keystrokes flow.
      let readableCallbacks = [];
      Module.pty.onReadable(() => {
        readableCallbacks.forEach((cb) => cb());
        readableCallbacks = [];
      });
      Module['preRun'].push((mod) => {
        mod['TTY'].stream_ops.poll = (stream, timeout, notifyCallback) => {
          if (Module.pty.readable) return 1;
          if (notifyCallback != null) {
            notifyCallback.registerCleanupFunc(() => {
              const i = readableCallbacks.indexOf(notifyCallback);
              if (i != -1) readableCallbacks.splice(i, 1);
            });
            readableCallbacks.push(notifyCallback);
          }
          return 0;
        };
      });

      document.body.classList.add('term-loaded');
      (async () => { await initEmscriptenModule(Module); })();
    }
  </script>
</body>
</html>
