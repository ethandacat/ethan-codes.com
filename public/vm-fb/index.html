<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ubuntu 22.04 desktop — framebuffer over 9p (Path C)</title>
  <link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" />
  <style>
    html, body { margin: 0; background: #14171c; color: #cdd; font: 13px/1.5 monospace; }
    #bar { padding: 6px 10px; display: flex; gap: 10px; align-items: center; }
    #bar button { font: inherit; background: #223; color: #cdd; border: 1px solid #456; border-radius: 5px; padding: 3px 10px; cursor: pointer; }
    #status { color: #7c9; }
    #stage { display: flex; gap: 10px; padding: 0 10px 10px; align-items: flex-start; }
    #screen { background: #000; border: 1px solid #345; image-rendering: pixelated; max-width: 70vw; }
    #terminal { flex: 1; height: 460px; min-width: 380px; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="blit">▶ start framebuffer</button>
    <button id="once">single frame</button>
    <span id="status">loading VM…</span>
  </div>
  <div id="stage">
    <canvas id="screen" width="1024" height="768"></canvas>
    <div id="terminal"></div>
  </div>

  <script src="./load.js"></script>
  <script type="module">
    import 'https://unpkg.com/xterm@5.3.0/lib/xterm.js';
    import 'https://unpkg.com/xterm-pty/index.js';
    import './arg-module.js';
    import initEmscriptenModule from './out.js';

    const status = (m) => { document.getElementById('status').textContent = m; };
    const xterm = new Terminal({ fontSize: 12, convertEol: true });
    xterm.open(document.getElementById('terminal'));
    const { master, slave } = openpty();
    xterm.loadAddon(master);
    Module.pty = slave;
    Module['mainScriptUrlOrBlob'] = new URL('./out.js', import.meta.url).href;
    window.Module = Module;

    // ---- framebuffer blitter -------------------------------------------
    // Channel: a second virtio-blk disk backed by the Emscripten-FS file
    // /tmp/fbdisk. The guest does `dd if=/dev/fb0 of=/dev/vdb`; we read the
    // same backing file out of Module.FS and blit it. (9p is rejected by
    // qemu-wasm, but virtio-blk works — it's how the rootfs is served.)
    const FB = { w: 1280, h: 800, bpp: 32, stride: 5120 };
    const FB_BYTES = FB.stride * FB.h; // 4,096,000
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');

    function blitOnce() {
      const m = FB;
      let raw;
      try { raw = Module.FS.readFile('/tmp/fbdisk'); } catch (e) { status('no /tmp/fbdisk yet'); return false; }
      if (canvas.width !== m.w || canvas.height !== m.h) { canvas.width = m.w; canvas.height = m.h; }
      const out = ctx.createImageData(m.w, m.h);
      const px = out.data;
      const stride = m.stride || m.w * 4;
      // bochs-drm 32bpp is XRGB8888 → bytes B,G,R,X (little-endian). Convert to RGBA.
      for (let y = 0; y < m.h; y++) {
        let si = y * stride;
        let di = y * m.w * 4;
        for (let x = 0; x < m.w; x++) {
          px[di]     = raw[si + 2]; // R
          px[di + 1] = raw[si + 1]; // G
          px[di + 2] = raw[si];     // B
          px[di + 3] = 255;         // A
          si += 4; di += 4;
        }
      }
      ctx.putImageData(out, 0, 0);
      status(`frame ${m.w}×${m.h}@${m.bpp} · ${raw.length} bytes`);
      return true;
    }

    let timer = null;
    document.getElementById('once').onclick = blitOnce;
    document.getElementById('blit').onclick = (e) => {
      if (timer) { clearInterval(timer); timer = null; e.target.textContent = '▶ start framebuffer'; return; }
      e.target.textContent = '⏸ stop';
      timer = setInterval(blitOnce, 200); // ~5 fps
    };

    // ---- boot ----------------------------------------------------------
    const info = 't:' + Math.round(Date.now() / 1000) + '\n';
    start(info);
    function start(info) {
      Module['preRun'].push((mod) => {
        try { mod.FS.mkdir('/pack'); } catch (e) {}
        mod.FS.writeFile('/pack/info', info);
        // Pre-create the framebuffer channel disk (becomes /dev/vdb in the guest).
        try { mod.FS.writeFile('/tmp/fbdisk', new Uint8Array(FB_BYTES)); } catch (e) {}
      });
      let cbs = [];
      Module.pty.onReadable(() => { cbs.forEach((cb) => cb()); cbs = []; });
      Module['preRun'].push((mod) => {
        mod['TTY'].stream_ops.poll = (stream, timeout, notify) => {
          if (Module.pty.readable) return 1;
          if (notify != null) { notify.registerCleanupFunc(() => { const i = cbs.indexOf(notify); if (i != -1) cbs.splice(i, 1); }); cbs.push(notify); }
          return 0;
        };
      });
      status('booting… (mount 9p + start capture in the terminal, then press ▶)');
      (async () => { await initEmscriptenModule(Module); })();
    }
  </script>
</body>
</html>
